name: Build executables

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: macos-x64
            runner: macos-26-intel
          - target: macos-arm64
            runner: macos-latest
          - target: windows-x64
            runner: windows-latest
            ext: .exe
          - target: windows-arm64
            runner: windows-11-arm
            ext: .exe

    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1

      - run: dart pub get

      - name: Compile
        shell: bash
        run: |
          mkdir -p out/bin dist
          dart compile exe bin/server.dart -o out/bin/fleer_relay-${{ matrix.target }}${{ matrix.ext }}
          grep '^version:' pubspec.yaml | awk '{print $2}' > out/CURRENT_VERSION.txt || echo unknown > out/CURRENT_VERSION.txt
          echo "$GITHUB_SHA" > out/LATEST_COMMIT_HASH.txt

      - name: Package
        shell: bash
        run: |
          name=fleer_relay-${{ matrix.target }}
          tar -czf "dist/$name.tar.gz" -C out .

      - uses: actions/upload-artifact@v4
        with:
          name: fleer_relay-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  release:
    # Only publish a release when triggered by a version tag
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: fleer_relay-*
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true